[project]
name = "safeascent-backend"
version = "1.0.0"
description = "SafeAscent climbing-safety API, Celery worker and beat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "certifi==2026.7.22",
    "geoalchemy2==0.15.2",
    "greenlet==3.3.1",
    "alembic==1.14.0",
    "redis==5.2.0",
    "celery[redis]==5.4.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "numpy==2.2.1",
    "python-dotenv==1.2.3",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "pyyaml==6.0.3",
    "ruff==0.8.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "fakeredis==2.38.0",
]

[tool.uv]
# An application, not a library: run from backend/ with `app` on the path.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--verbose --cov=app --cov-report=term-missing --cov-report=html -m 'not needs_data'"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    "needs_data: needs a populated database or live services; run with -m needs_data",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit so a ruff upgrade cannot silently widen the rule set; ruff itself is
# pinned in the dev group.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["app"]

# Untyped legacy code is ignored until touched; modules graduate into the
# strict allowlist below as they are typed.
[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

# Strict allowlist. Append modules here as they become strict-clean.
# `strict = true` is spelled out here rather than used directly: mypy's `strict`
# flag is documented as global-only, and setting it inside one override section
# leaks its component flags (e.g. disallow_subclassing_any) into *other*
# per-module override sections that never asked for them — reproduced against
# mypy 2.3.1 while adding the celery-adjacent block below.
# warn_redundant_casts is left out: mypy accepts it only globally, not per-module.
[[tool.mypy.overrides]]
module = [
    "app.config",
    "app.services.risk_bands",
    "app.healthchecks",
    "app.pipelines",
    "app.pipelines.validate",
    "app.pipelines.grid",
]
ignore_errors = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Same allowlist strictness, minus the two checks celery's untyped API always
# trips: subclassing bootsteps.StartStopStep (has type Any) and @celery_app.task
# (an untyped decorator). Everything else strict still enforces, incl. untyped calls.
[[tool.mypy.overrides]]
module = ["app.celery_signals", "app.tasks.ops"]
ignore_errors = false
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# SQLAlchemy models: declarative_base() is typed Any, so subclassing Base always trips
# disallow_subclassing_any; everything else strict still applies.
[[tool.mypy.overrides]]
module = ["app.models.pipeline"]
ignore_errors = false
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
