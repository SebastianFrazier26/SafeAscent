# Railway: Celery worker. Beat runs as its own service (railway-beat.toml); embedding it
# here let beat keep publishing while the consumer was hung (2026-08 outage).
# Two slots: beat_heartbeat needs one free while the ~2h nightly holds the other (its Redis lock stops overlap).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Also relied on by the nightly lock's stale-lock inspect() census (safety_computation_optimized.py).
numReplicas = 1
startCommand = "celery -A app.celery_app worker --loglevel=info --concurrency=2 -E"
