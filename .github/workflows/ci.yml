name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: safeascent_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/safeascent_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      MP_TABLES_AVAILABLE: "false"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen --group pipelines --group train

      - name: Lint
        run: uv run ruff check . ../scripts/

      - name: Type check
        run: uv run --group train mypy

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --group pipelines --group llm --group train --no-emit-project --format requirements.txt \
            | uv run pip-audit -r /dev/stdin --require-hashes --disable-pip

      - name: Test
        run: uv run --group train pytest
        env:
          MIGRATIONS_TEST_ADMIN_URL: postgresql://test_user:test_password@localhost:5432/postgres

      # Credential-free: the suite on a synthetic world, no database, no network (pre-flight F48).
      - name: Fixture backtest
        run: uv run --group train python -m app.ml.backtest --fixture small

      - name: Build image and smoke-test imports
        run: |
          docker build -t safeascent-backend:ci .
          docker run --rm -e DATABASE_URL="$DATABASE_URL" safeascent-backend:ci \
            python -c "import app.main, app.celery_app; import importlib.util as u; assert u.find_spec('anthropic') is None, 'anthropic in the API image'; assert u.find_spec('rasterio') is None, 'rasterio in the API image'"

      - name: Build jobs image and smoke-test imports
        run: |
          docker build -f Dockerfile.jobs -t safeascent-jobs:ci .
          docker run --rm -e DATABASE_URL="$DATABASE_URL" safeascent-jobs:ci \
            python -c "import h3, rasterio, timezonefinder, app.pipelines.catalog_cycle; import importlib.util as u; assert u.find_spec('pytest') is None; assert u.find_spec('anthropic') is None, 'anthropic in the jobs image'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_MAPBOX_TOKEN: pk.test_token_for_ci
        run: npm run build

      - name: Image tests (app and maintenance mode)
        run: ./docker-tests/test_images.sh all

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: No scraper code (D9)
        run: python scripts/check_no_scrapers.py

      - name: No Mountain Project data in data/docs/tests
        run: python scripts/check_no_mp_data.py

      - name: docker-compose mirrors the Railway services
        run: |
          services="$(docker compose config --services | sort | tr '\n' ' ')"
          echo "compose services: $services"
          [ "$services" = "api beat db frontend redis worker " ]

      - name: docker-compose worker/beat commands match Railway startCommand
        run: python scripts/check_compose_matches_railway.py

  # The single required status check (branch protection and Railway "Wait for
  # CI" key on this name). always() so a failed or skipped dependency reports
  # as a failure here instead of leaving the check pending forever.
  ci-ok:
    if: always()
    needs: [backend, frontend, guards]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
